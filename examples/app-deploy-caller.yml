# Copy to .github/workflows/deploy.yml in an application repository.
# Requires:
#   1. kapillohani023/deploy → Settings → Actions → General → Access
#      → "Accessible from repositories owned by the user"
#   2. Secrets in THIS app repo: EC2_HOST, EC2_USER, EC2_SSH_KEY
#      (and NEXT_PUBLIC_VAPID_PUBLIC_KEY for streaks)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: kapillohani023/deploy/.github/workflows/app-deploy.yml@main
    with:
      service: CHANGE_ME          # e.g. streaks, task-to-api, portfolio
      extra_services: ""          # e.g. "streaks-cron" for streaks; else ""
    secrets: inherit

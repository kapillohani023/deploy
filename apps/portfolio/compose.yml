services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-ghcr.io/kapillohani023/portfolio:latest}
    restart: unless-stopped
    env_file:
      - /opt/apps/env/portfolio.env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

services:
  task-to-api:
    image: ${TASK_TO_API_IMAGE:-ghcr.io/kapillohani023/task-to-api:latest}
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - /opt/apps/env/task-to-api.env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/privacy"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

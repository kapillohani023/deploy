# Self-contained app deploy. Use this if you do not want to grant the
# private deploy repo's reusable workflow to other repositories.
# Copy to .github/workflows/deploy.yml in the app repo, then set SERVICE
# (and EXTRA_SERVICES if needed) in the env block below.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVICE: CHANGE_ME          # e.g. streaks
  EXTRA_SERVICES: ""          # e.g. streaks-cron

jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and recreate on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # image tag is expanded on the runner on purpose
          HOST="${EC2_USER}@${EC2_HOST}"
          echo "$GHCR_TOKEN" | ssh "$HOST" 'docker login ghcr.io -u "'"$GHCR_USER"'" --password-stdin'
          OVERRIDE="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_IMAGE"
          ssh "$HOST" "export ${OVERRIDE}=$(printf '%q' "$IMAGE_TAG"); bash /opt/deploy/scripts/up-app.sh $(printf '%q' "$SERVICE") $EXTRA_SERVICES"

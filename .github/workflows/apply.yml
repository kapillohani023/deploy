# Applies this repo to the server: rsync -> /opt/deploy, then apply.sh
# (or bootstrap.sh on a fresh instance).
name: Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apply-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'sudo mkdir -p /opt/deploy /opt/apps/env && sudo chown -R '"${{ secrets.EC2_USER }}"':'"${{ secrets.EC2_USER }}"' /opt/deploy /opt/apps/env'

      - name: Rsync to /opt/deploy
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'templates/' \
            --exclude 'examples/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'STEPS.md' \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/deploy/"

      - name: Bootstrap or apply
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOS'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            sudo bash /opt/deploy/scripts/bootstrap.sh
          else
            bash /opt/deploy/scripts/apply.sh
          fi
          EOS
